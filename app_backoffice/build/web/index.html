<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Eco-Guide — tableau de bord d'administration">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Eco-Guide Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Eco-Guide Admin</title>
  <link rel="manifest" href="manifest.json">

  <!-- Branded loading splash (shown until the Flutter app is ready) -->
  <style>
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      transition: opacity .45s ease;
    }
    #splash.splash--hidden { opacity: 0; pointer-events: none; }
    #splash img { width: 150px; height: auto; }
    #splash .splash-title {
      margin-top: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #2E7D32;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: .4px;
    }
    #splash .splash-bar {
      margin-top: 22px;
      width: 170px;
      height: 4px;
      border-radius: 4px;
      background: #e4e8e5;
      overflow: hidden;
    }
    #splash .splash-bar::before {
      content: '';
      display: block;
      height: 100%;
      width: 40%;
      border-radius: 4px;
      background: #2E7D32;
      animation: splash-slide 1.1s infinite ease-in-out;
    }
    @keyframes splash-slide {
      0%   { transform: translateX(-120%); }
      100% { transform: translateX(370%); }
    }
  </style>

  <!-- Google Identity Services — replace with your Web Client ID from Google Cloud Console -->
  <meta name="google-signin-client_id" content="YOUR_GOOGLE_WEB_CLIENT_ID.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <!-- Splash: visible instantly, removed once Flutter renders -->
  <div id="splash">
    <img src="icons/Icon-512.png" alt="Eco-Guide" />
    <div class="splash-title">Eco-Guide Admin</div>
    <div class="splash-bar"></div>
  </div>
  <script>
    (function () {
      function hideSplash() {
        var s = document.getElementById('splash');
        if (!s || s.classList.contains('splash--hidden')) return;
        s.classList.add('splash--hidden');
        setTimeout(function () {
          if (s && s.parentNode) s.parentNode.removeChild(s);
        }, 600);
      }
      // Hide as soon as Flutter attaches its view…
      var obs = new MutationObserver(function () {
        if (document.querySelector('flutter-view') ||
            document.querySelector('flt-glass-pane')) {
          hideSplash();
          obs.disconnect();
        }
      });
      obs.observe(document.documentElement, { childList: true, subtree: true });
      // …with a safety fallback so it never stays stuck.
      window.addEventListener('load', function () {
        setTimeout(hideSplash, 8000);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
