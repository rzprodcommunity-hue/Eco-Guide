name: app_front
description: "Eco-Guide - Hiking companion app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # HTTP client
  http: ^1.2.2

  # Local storage
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
  path: ^1.9.1
  path_provider: ^2.1.5

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Location
  geolocator: ^13.0.2

  # Image caching
  cached_network_image: ^3.4.1

  # URL launcher (for phone calls, etc.)
  url_launcher: ^6.3.1

  # Internationalization
  intl: ^0.20.2
  connectivity_plus: ^7.1.0
  flutter_cache_manager: ^3.4.1
  supabase_flutter: ^2.12.4
  flutter_dotenv: ^6.0.1
  video_player: ^2.9.2
  chewie: ^1.8.5
  youtube_player_flutter: ^9.1.1
  flutter_tts: ^4.2.0
  flutter_compass: ^0.8.1

  # QR scanning (unlock trails) + payload signature verification
  mobile_scanner: ^5.2.3
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  # Green lotus centered on a WHITE background (square, used for legacy
  # Android + iOS — logo_white.png is opaque white so the icon has a white bg).
  image_path: "assets/images/logo_white.png"
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  min_sdk_android: 21
  # Android 8+ adaptive icon: white background + green lotus foreground
  # (logo_fg.png keeps a transparent margin so the lotus isn't clipped).
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_fg.png"
  web:
    generate: false

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - .env
    - assets/images/logo.png
    - assets/images/bot.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
